name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Criar projeto
        run: |
          mkdir -p app/src/main/java/com/tradutor/jogos
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "TradutorJogos"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.tradutor.jogos"
              compileSdk = 34
              defaultConfig { applicationId = "com.tradutor.jogos"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("com.google.mlkit:translate:17.0.3")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application android:label="Tradutor de Jogos" android:theme="@android:style/Theme.DeviceDefault.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".TradutorService" android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/tradutor/jogos/MainActivity.kt <<'EOF'
          package com.tradutor.jogos

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import com.google.mlkit.common.model.DownloadConditions
          import com.google.mlkit.nl.translate.TranslateLanguage
          import com.google.mlkit.nl.translate.Translation
          import com.google.mlkit.nl.translate.TranslatorOptions

          class MainActivity : Activity() {
              private lateinit var status: TextView

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  status = TextView(this).apply {
                      setPadding(48, 96, 48, 48); textSize = 18f
                      text = "1) Toque em Ativar\n2) Permita sobrepor outros apps\n3) Aceite a captura de tela\n\nDepois abra o jogo e toque no botão PT."
                  }
                  val btn = Button(this).apply { text = "Ativar tradutor"; setOnClickListener { iniciar() } }
                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; addView(status); addView(btn)
                  })
              }

              private fun iniciar() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1); return
                  }
                  status.text = "Preparando modelo de tradução (precisa de internet só na 1ª vez)..."
                  val tr = Translation.getClient(TranslatorOptions.Builder()
                      .setSourceLanguage(TranslateLanguage.ENGLISH).setTargetLanguage(TranslateLanguage.PORTUGUESE).build())
                  tr.downloadModelIfNeeded(DownloadConditions.Builder().build())
                      .addOnSuccessListener { pedirCaptura() }
                      .addOnFailureListener { status.text = "Falhou. Conecte à internet uma vez para baixar o modelo e tente de novo." }
              }

              override fun onRequestPermissionsResult(c: Int, p: Array<out String>, r: IntArray) { iniciar() }

              private fun pedirCaptura() {
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  startActivityForResult(mpm.createScreenCaptureIntent(), 42)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(r: Int, c: Int, d: Intent?) {
                  if (r == 42 && c == RESULT_OK && d != null) {
                      startForegroundService(Intent(this, TradutorService::class.java).putExtra("code", c).putExtra("data", d))
                      moveTaskToBack(true)
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/tradutor/jogos/TradutorService.kt <<'EOF'
          package com.tradutor.jogos

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.drawable.GradientDrawable
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.util.DisplayMetrics
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.TextView
          import com.google.mlkit.nl.translate.TranslateLanguage
          import com.google.mlkit.nl.translate.Translation
          import com.google.mlkit.nl.translate.TranslatorOptions
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.Text
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import kotlin.math.abs

          class TradutorService : Service() {
              private lateinit var wm: WindowManager
              private val handler = Handler(Looper.getMainLooper())
              private var projection: MediaProjection? = null
              private var display: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private var ultima: Image? = null
              private var botao: TextView? = null
              private var overlay: FrameLayout? = null
              private var ocupado = false
              private var largura = 0
              private var altura = 0
              private val ocr = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
              private val tradutor = Translation.getClient(
                  TranslatorOptions.Builder()
                      .setSourceLanguage(TranslateLanguage.ENGLISH)
                      .setTargetLanguage(TranslateLanguage.PORTUGUESE).build()
              )

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, f: Int, id: Int): Int {
                  if (projection != null || intent == null) return START_NOT_STICKY
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(NotificationChannel("t", "Tradutor", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "t").setContentTitle("Tradutor ativo")
                      .setContentText("Toque em PT para traduzir. Segure PT para sair.")
                      .setSmallIcon(android.R.drawable.ic_menu_edit).build()
                  if (Build.VERSION.SDK_INT >= 29)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  else startForeground(1, n)

                  @Suppress("DEPRECATION")
                  val data = intent.getParcelableExtra<Intent>("data")!!
                  val p = getSystemService(MediaProjectionManager::class.java)
                      .getMediaProjection(intent.getIntExtra("code", 0), data)
                  p.registerCallback(object : MediaProjection.Callback() { override fun onStop() { stopSelf() } }, handler)
                  projection = p

                  val m = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  wm.defaultDisplay.getRealMetrics(m)
                  largura = m.widthPixels; altura = m.heightPixels
                  val r = ImageReader.newInstance(largura, altura, PixelFormat.RGBA_8888, 3)
                  r.setOnImageAvailableListener({ rd ->
                      rd.acquireLatestImage()?.let { ultima?.close(); ultima = it }
                  }, handler)
                  reader = r
                  display = p.createVirtualDisplay("cap", largura, altura, m.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, r.surface, null, handler)
                  criarBotao()
                  return START_NOT_STICKY
              }

              private fun criarBotao() {
                  val b = TextView(this).apply {
                      text = "PT"; setTextColor(Color.WHITE); textSize = 16f; gravity = Gravity.CENTER
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(0xCC1565C0.toInt()) }
                  }
                  val lp = WindowManager.LayoutParams(
                      150, 150, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START; x = 20; y = 400 }
                  var dx = 0f; var dy = 0f; var ix = 0; var iy = 0; var moveu = false
                  b.setOnTouchListener { v, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { dx = e.rawX; dy = e.rawY; ix = lp.x; iy = lp.y; moveu = false; true }
                          MotionEvent.ACTION_MOVE -> {
                              if (abs(e.rawX - dx) > 15 || abs(e.rawY - dy) > 15) moveu = true
                              if (moveu) { lp.x = ix + (e.rawX - dx).toInt(); lp.y = iy + (e.rawY - dy).toInt(); wm.updateViewLayout(v, lp) }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moveu) { if (e.eventTime - e.downTime > 700) stopSelf() else aoTocar() }
                              true
                          }
                          else -> false
                      }
                  }
                  wm.addView(b, lp); botao = b
              }

              private fun aoTocar() {
                  if (overlay != null) { removerOverlay(); return }
                  if (ocupado) return
                  val img = ultima ?: return
                  val p = img.planes[0]
                  val bmp = Bitmap.createBitmap(p.rowStride / p.pixelStride, altura, Bitmap.Config.ARGB_8888)
                  bmp.copyPixelsFromBuffer(p.buffer)
                  val tela = Bitmap.createBitmap(bmp, 0, 0, largura, altura)
                  ocupado = true; botao?.text = "…"
                  ocr.process(InputImage.fromBitmap(tela, 0))
                      .addOnSuccessListener { traduzir(it.textBlocks) }
                      .addOnFailureListener { fim() }
              }

              private fun traduzir(blocos: List<Text.TextBlock>) {
                  val itens = blocos.filter { it.boundingBox != null && it.text.any { c -> c.isLetter() } }
                  if (itens.isEmpty()) { fim(); return }
                  val raiz = FrameLayout(this)
                  raiz.setOnClickListener { removerOverlay() }
                  var faltam = itens.size
                  itens.forEach { b ->
                      val r = b.boundingBox!!
                      tradutor.translate(b.text.replace("\n", " "))
                          .addOnSuccessListener { pt -> adicionar(raiz, r, pt) }
                          .addOnCompleteListener { if (--faltam == 0) mostrar(raiz) }
                  }
              }

              private fun adicionar(raiz: FrameLayout, r: Rect, pt: String) {
                  val tv = TextView(this).apply {
                      text = pt; setTextColor(Color.WHITE); setBackgroundColor(0xEE000000.toInt())
                      gravity = Gravity.CENTER_VERTICAL; setPadding(6, 2, 6, 2)
                      setAutoSizeTextTypeUniformWithConfiguration(8, 26, 1, TypedValue.COMPLEX_UNIT_SP)
                  }
                  raiz.addView(tv, FrameLayout.LayoutParams(r.width() + 8, r.height() + 4).apply {
                      leftMargin = r.left - 4; topMargin = r.top - 2
                  })
              }

              private fun mostrar(raiz: FrameLayout) {
                  val lp = WindowManager.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      if (Build.VERSION.SDK_INT >= 28)
                          layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  wm.addView(raiz, lp); overlay = raiz
                  fim()
                  botao?.text = "X"
              }

              private fun fim() { ocupado = false; if (overlay == null) botao?.text = "PT" }

              private fun removerOverlay() {
                  overlay?.let { runCatching { wm.removeView(it) } }
                  overlay = null; botao?.text = "PT"
              }

              override fun onDestroy() {
                  removerOverlay()
                  botao?.let { runCatching { wm.removeView(it) } }
                  ultima?.close(); display?.release(); reader?.close(); projection?.stop()
                  ocr.close(); tradutor.close()
                  super.onDestroy()
              }
          }
          EOF
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: TradutorJogos-apk, path: app/build/outputs/apk/debug/app-debug.apk }
        
